// RocketFailure settings. Re-read every time the flight scene loads.
ROCKET_FAILURE
{
	enabled = true

	// Landed vessel tilted more than tiltAngle (degrees) from the local surface normal.
	tippingEnabled = true
	tiltAngle = 60

	// Splashed vessel tilted more than splashTiltAngle from vertical.
	splashTippingEnabled = true
	splashTiltAngle = 75

	// Vessels shorter than this (metres, between part centres) are never checked for tipping.
	minVesselHeight = 2.5

	// Splashed vessel whose centre of mass is more than sinkDepth metres below sea level.
	sinkingEnabled = true
	sinkDepth = 10

	// Touchdown with a descent rate above impactSpeed (m/s) destroys the vessel instantly.
	impactEnabled = true
	impactSpeed = 20

	// Seconds a tipping/sinking condition must persist before failure.
	failureDelay = 3

	// Probability (0-1) that a dangerous condition actually destroys the vessel.
	failureChance = 1

	// Also check debris (spent stages).
	includeDebris = false
}
